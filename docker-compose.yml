version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: f4-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vueladata_net

  stream_f4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-f4-producer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin123}
      QUEUE_NAME: ${QUEUE_NAME:-eventos_oooi_queue}
      STREAM_DELAY_SECONDS: ${STREAM_DELAY_SECONDS:-1}
      TOTAL_VUELOS: ${TOTAL_VUELOS:-100}
    networks:
      - vueladata_net
    restart: on-failure

networks:
  vueladata_net:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
