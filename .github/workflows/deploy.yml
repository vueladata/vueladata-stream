name: Deploy VuelaData Stream Producer to AWS ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: vueladata/stream-producer
  ECS_CLUSTER: vueladata-cluster
  ECS_SERVICE: vueladata-stream-producer-service

jobs:
  validate:
    name: Validate Python Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Code Syntax
        run: |
          python -m py_compile src/producer.py src/oooi_generator.py
          echo "Sintaxis validada exitosamente."

  build-and-deploy:
    name: Build, Push to ECR & Deploy to ECS
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Compilando imagen linux/amd64 para ECR: $ECR_REGISTRY/$ECR_REPOSITORY..."
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "Subiendo imagen a ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS
        run: |
          echo "Verificando servicio $ECS_SERVICE en clúster $ECS_CLUSTER..."
          STATUS=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" == "ACTIVE" ]; then
            echo ">>> Actualizando servicio en caliente: $ECS_SERVICE"
            aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
          else
            echo ">>> Aviso: Servicio $ECS_SERVICE no está activo en ECS (estado: $STATUS), omitiendo actualización automática."
          fi
          echo "Proceso finalizado."
